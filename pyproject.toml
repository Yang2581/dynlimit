[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynlimit"
version = "0.1.1"
description = "DynLimit — Dynamics at the Limit (vehicle dynamics simulation & evaluation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24",
  "mcap>=1.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "PyYAML>=6.0",
  "tomli>=2.0.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27.0"]
cuda = ["torch>=2.0"]

[project.scripts]
dynlimit = "backend.app.cli:main"
dynlimit-api = "backend.app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
